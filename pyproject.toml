[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ddbapi"
version = "0.1.2"
description = "Library for querying DDB infrastructure"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Karl Krägelin", email = "kraegelin@sub.uni-goettingen.de" }]
dependencies = ["requests>=2.32", "pandas>=2.2", "urllib3>=2"]

[project.urls]
Repository = "https://github.com/karkraeg/ddbapi"

[tool.setuptools.packages.find]
include = ["ddbapi*"]
